name: Claude

# Responds to @claude mentions on issues, PRs, and review comments.
#
# THIS IS A PUBLIC REPOSITORY. Two things follow, and both are deliberate:
#
#   1. `allowed_non_write_users` and `allowed_bots` are left UNSET. Their defaults deny
#      everyone without write access, and every bot. Setting either would let anyone on
#      the internet invoke Claude here with a prompt they control. Do not set them.
#   2. Anyone can open an issue on a public repo, and Claude reads that text once a
#      trusted user invokes it. The gates below bound WHO triggers a run and HOW MUCH it
#      can spend — they do not bound what Claude reads. Treat issue and comment content
#      as untrusted input.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN is a repo secret from `claude setup-token`. It draws on
# a personal Claude Max seat and EXPIRES 2027-08-15, after which runs fail with
# "Login expired".
#
# github_token is deliberately NOT passed: omitting it makes the action authenticate as
# the Claude GitHub App, which is what allows Claude's commits to trigger ci.yml.
# Passing GITHUB_TOKEN would look correct and silently stop CI running on its changes.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only run when someone actually said @claude. Without this gate every comment in
    # the repo would start a job and spend tokens.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest

    # One run per issue or PR. This shares a personal Max rate-limit pool with
    # interactive work, so a burst of mentions must not fan out into parallel runs.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false

    timeout-minutes: 30

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
