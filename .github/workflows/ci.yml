name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: build
        run: |
          go build ./...

      - name: vet
        run: |
          go vet ./...

      # No -skip here: a bare test name in -skip applies to every package in
      # ./..., not just the one it was written for (go-projectusat#53). The
      # two tests that are red on purpose (parser.Parse returns "Not
      # implemented" until go-projectusat#61 lands) skip themselves, with
      # the reason next to the test instead of in this file.
      - name: test
        run: |
          go test ./...
